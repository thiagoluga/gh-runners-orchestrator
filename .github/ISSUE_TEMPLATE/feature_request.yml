name: Feature request
description: Propose a change of behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, with a concrete case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What the orchestrator should do. If it contradicts an ADR, say which.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does it widen what a job, a repository or the credential can reach?
